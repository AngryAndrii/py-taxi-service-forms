{% extends "base.html" %}

{% block content %}
  <h1>Car list <a style="float: right" href="{% url "taxi:car-create" %}">+</a></h1>
  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url "taxi:car-detail" pk=car.id %} ">{{ car.id }}</a>
          {{ car.model }} ({{ car.manufacturer.name }})
          <div><a class="btn btn-primary" tabindex="-1" role="button" aria-disabled="true"
                  href="{% url "taxi:car-update" pk=car.id %}">Update</a>
            <a class="btn btn-danger" tabindex="-1" role="button" aria-disabled="true"
               href="{% url "taxi:car-delete" pk=car.id %}">Delete</a></div>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no cars in taxi</p>
  {% endif %}
{% endblock %}
